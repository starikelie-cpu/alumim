<head>

    <meta name="apple-mobile-web-app-title" content="בית כנסת">
    <meta name="application-name" content="בית כנסת">
    <meta name="msapplication-TileColor" content="#1a3a5c">
    <meta name="msapplication-TileImage" content="/icon-192.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">

    <link rel="manifest" href="/manifest.json">
    <title>ניהול מתפללים | בית כנסת</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Assistant', sans-serif;
            background-color: #f0f2f5;
        }
        
        /* Splash Screen Styles */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a3a5c 0%, #2d6a9f 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        
        #splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .splash-icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        
        .splash-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            color: #fff;
        }
        
        .splash-subtitle {
            font-size: 14px;
            color: #a8c8e8;
            margin-bottom: 28px;
        }
        
        .splash-bar-wrap {
            width: 260px;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .splash-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4fc3f7, #81d4fa);
            border-radius: 3px;
            animation: fill 4s ease-in-out forwards;
        }
        
        @keyframes fill {
            0% { width: 5% }
            40% { width: 60% }
            80% { width: 85% }
            100% { width: 95% }
        }
        
        .splash-status {
            font-size: 12px;
            color: #7baed4;
            margin-top: 12px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.6 }
            50% { opacity: 1 }
        }
    </style>
    <script type="module" src="/src/main.jsx"></script>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-icon">🕍</div>
        <div class="splash-title">ניהול בית כנסת</div>
        <div style="font-size: 13px; color: #ffd54f; margin-bottom: 6px; font-weight: 600;">להתקשרות: אלי סטריק - 052-3375529</div>
        <div class="splash-subtitle">מאתחל את המערכת...</div>
        <div class="splash-bar-wrap">
            <div class="splash-bar"></div>
        </div>
        <div class="splash-status">מתחבר לשרת...</div>
    </div>
    
    <div id="root"></div>
</body>
</html>
