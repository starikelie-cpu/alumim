directories:
  output: build-output-new
  buildResources: build
artifactName: Nihul Beit Cnecet Setup ${version}.exe
compression: store
extraResources:
  - from: dist
    to: dist
appId: com.synagogue.management
productName: Nihul Beit Cnecet
asar: false
files:
  - filter:
      - dist/**/*
      - public/**/*
      - index.js
      - db.js
      - accessControl.js
      - electron.cjs
      - package.json
      - prague_synagogue_icon.ico
      - data/**/*
      - .env
      - node_modules/**/*
      - '!node_modules/antd/**'
      - '!**/synagogue-management-v1.4.15/**'
      - '!**/Nihul Beit Cnecet 1.4.3-portable-installed/**'
win:
  target: nsis
  icon: prague_synagogue_icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  runAfterFinish: true
  useZip: true
electronVersion: 40.3.0
